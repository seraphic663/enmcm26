name: Temporary LSTM history grid

on:
  push:
    branches:
      - experiment/lstm-20261109
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run history-grid shard
        run: |
          set -o pipefail
          python experiments/lstm_history_grid.py --shards 6 --shard-index ${{ matrix.shard }} 2>&1 | tee lstm-history-grid-shard${{ matrix.shard }}.log
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lstm-history-grid-shard-${{ matrix.shard }}
          path: |
            lstm-history-grid-shard${{ matrix.shard }}.log
            history-grid-results-shard${{ matrix.shard }}-of-6.json
            history-grid-aggregate-shard${{ matrix.shard }}-of-6.csv
          if-no-files-found: warn
