name: Temporary Dual-LSTM Dynamic-removal ablation

on:
  push:
    branches:
      - experiment/lstm-resnet-20261110
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - dynamic_patch
          - dynamic_skip
          - yesterday_skip
          - week1_skip
          - week2mean_skip
          - pure_dual
          - learned_gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run architecture
        run: |
          set -o pipefail
          python experiments/lstm_resnet_ablation.py --arch ${{ matrix.arch }} 2>&1 | tee resnet-${{ matrix.arch }}.log
      - name: Upload architecture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resnet-${{ matrix.arch }}
          path: |
            resnet-${{ matrix.arch }}.log
            resnet-ablation-${{ matrix.arch }}.json
          if-no-files-found: warn
