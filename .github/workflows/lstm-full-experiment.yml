name: Temporary Dynamic ablation

on:
  push:
    branches:
      - experiment/dynamic-ablation-20261110
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - full
          - no_bias
          - no_load_season
          - no_pv_season
          - no_selector_yesterday
          - fixed70
          - no_soc_state
          - no_reserve
          - stripped_forecast
          - minimal_selector_fixed70
          - minimal_yesterday_fixed70
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run ablation variant
        run: |
          set -o pipefail
          python experiments/dynamic_ablation.py --variant ${{ matrix.variant }} 2>&1 | tee dynamic-ablation-${{ matrix.variant }}.log
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-ablation-${{ matrix.variant }}
          path: |
            dynamic-ablation-${{ matrix.variant }}.log
            dynamic-ablation-${{ matrix.variant }}.json
          if-no-files-found: warn
