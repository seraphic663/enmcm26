name: Temporary LSTM explicit reserve experiment

on:
  push:
    branches:
      - experiment/lstm-reserve-20261110
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - dynamic_skip
          - learned_gate
          - yesterday_skip
          - week1_skip
          - week2mean_skip
          - pure_dual
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run explicit reserve grid
        run: |
          set -o pipefail
          python experiments/lstm_reserve_experiment.py --arch ${{ matrix.arch }} 2>&1 | tee reserve-${{ matrix.arch }}.log
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reserve-${{ matrix.arch }}
          path: |
            reserve-${{ matrix.arch }}.log
            reserve-experiment-${{ matrix.arch }}.json
          if-no-files-found: warn
