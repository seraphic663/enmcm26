name: Temporary LSTM full experiment

on:
  push:
    branches:
      - experiment/lstm-20261109
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run strict-causal LSTM experiment
        run: |
          set -o pipefail
          python experiments/lstm_full_experiment.py 2>&1 | tee lstm-experiment.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lstm-experiment-log
          path: lstm-experiment.log
          if-no-files-found: warn
