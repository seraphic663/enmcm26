name: Temporary fixed-weekday2 Dynamic ablation

on:
  push:
    branches:
      - experiment/dynamic-weekday2-20261110
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run fixed weekday2 ablation
        run: |
          set -o pipefail
          python experiments/dynamic_ablation.py --variant fixed_weekday2 2>&1 | tee dynamic-ablation-fixed_weekday2.log
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-ablation-fixed-weekday2
          path: |
            dynamic-ablation-fixed_weekday2.log
            dynamic-ablation-fixed_weekday2.json
          if-no-files-found: warn
