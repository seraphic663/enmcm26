name: Temporary fixed-weekday2 reserve grid

on:
  push:
    branches:
      - experiment/fixed-weekday2-reserve-20261110
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run fixed-weekday2 reserve grid
        run: |
          set -o pipefail
          python experiments/lstm_reserve_fixed_weekday2.py 2>&1 | tee reserve-fixed-weekday2.log
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reserve-fixed-weekday2
          path: |
            reserve-fixed-weekday2.log
            reserve-experiment-fixed_weekday2_skip.json
          if-no-files-found: warn
